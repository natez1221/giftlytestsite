name: Check GIFTLY
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run standalone
      - uses: actions/upload-artifact@v4
        with:
          name: giftly-preview
          path: |
            work-preview/giftly-preview.html
            dist/
